[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-radar"
version = "0.1.0"
description = "Offline-first run-level analytics for corporate AI-agent prompts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Prompt Radar contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
core = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]
attachments = [
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "reportlab>=4.2,<5",
]
ml = [
  "hdbscan>=0.8.40,<0.9",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3.4,<6",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "umap-learn>=0.5.7,<0.6",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]
all = [
  "hdbscan>=0.8.40,<0.9",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3.4,<6",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "umap-learn>=0.5.7,<0.6",
]

[project.scripts]
prompt-radar = "prompt_radar.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: tests that require the real cached Qwen embedding model",
]
