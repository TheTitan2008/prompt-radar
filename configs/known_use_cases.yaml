    name: "Поиск данных по группе клиента"
    description: "Собрать сведения о компании-клиенте, дочерних организациях, руководителях и сделках."
    examples: ["Найди директоров дочерних компаний и выигранные сделки"]
    systems: ["CRM"]
    actions: ["search", "aggregate"]
    expected_outcome: "Карточка группы компаний"
    category_ids: ["crm_sales", "knowledge_search"]
    source_reference: "scenario 02"
    draft: true
