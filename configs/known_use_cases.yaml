schema_version: "1.0"
draft: true
source_note: "Draft normalization of 31 user-scenario rows from the official case workbook."
use_cases:
  - id: daily_email_digest
    name: "Ежедневная сводка почты"
    description: "Подготовить краткую структурированную сводку входящих писем за период по критериям пользователя."
    examples: ["Подготовь сводку важных писем за вчера"]
    systems: ["Email"]
    actions: ["read", "summarize"]
    expected_outcome: "Структурированная сводка писем"
    category_ids: ["email_communications"]
    source_reference: "scenario 01"
    draft: true
